[package]
name = "visual-rubric"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "EUPL-1.2"
repository = "https://codeberg.org/caniko/visual-rubric"
description = "AI-assisted screenshot rubric runner for local visual UX review"
readme = "README.md"
keywords = ["visual-testing", "screenshots", "rubric", "codex", "ux"]
categories = ["development-tools::testing"]

[features]
fake-codex-acp = []

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
which = "6"

[[bin]]
name = "visual-rubric"
path = "src/main.rs"

[[bin]]
name = "fake-codex-acp"
path = "tests/bin/fake_codex_acp.rs"
required-features = ["fake-codex-acp"]
