title = "visual-rubric"
tagline = "Catch visual regressions that structural tests cannot see"
subtitle = "visual-rubric sends a screenshot and a written question to an ACP reviewing agent, requires a strict JSON verdict, and adds the process pooling, retries and changed-asset batches a CI loop needs."

