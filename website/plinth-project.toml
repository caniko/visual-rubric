[[pages.sections]]
type = "feature_grid"
id = "overview"

[[pages.sections.features]]
title = "Verdicts you can branch on"
description = "The model must answer with verdict, reason and anomalies, so a caller decides from a value instead of parsing prose, and a failed or errored check stays audible."
highlight = true

[[pages.sections.features]]
title = "Deterministic gate first"
description = "A calibration corpus and a capture manifest are checked without calling a model, catching declared DOM, layout and runtime classes before semantic review runs."

[[pages.sections.features]]
title = "Ordered journeys"
description = "A sequence is sent as labelled multimodal frames with a bounded frame count, so the rubric judges the transition between checkpoints and not only each state."

[[pages.sections.features]]
title = "Read-only reviewer"
description = "The evaluator selects an advertised read-only or plan mode and denies permission requests rather than granting the reviewing model write access to the project."

[[pages.sections]]
type = "install"
id = "install"
heading = "Run a check"
intro = "The CLI takes an image path and a question; a Home Manager deployment can keep backend, model and mode in a config file instead."
guide_href = "https://github.com/caniko/visual-rubric"

[[pages.sections.primary_routes]]
label = "Single image"
audience = "CLI"
command = "visual-rubric --image site-desktop.png --question \"Does this page stay readable?\""
href = "https://github.com/caniko/visual-rubric#visual-rubric"
recommended = true

[[pages.sections.secondary_routes]]
label = "Static preview"
audience = "CLI, manual inspection"
command = "visual-rubric serve --root website/public --port 1111"
